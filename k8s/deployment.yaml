apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-demo
  namespace: storage-demo
  labels:
    app: storage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-demo
  template:
    metadata:
      labels:
        app: storage-demo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          image: storage-demo:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: storage-demo-config
          volumeMounts:
            - name: visits-data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: visits-data
          persistentVolumeClaim:
            claimName: visits-pvc
